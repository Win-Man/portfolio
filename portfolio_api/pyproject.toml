[project]
name = "portfolio_api"
version = "0.1.0"
description = "投资组合管理后端 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "akshare>=1.15.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    # 跳过 conftest 里「一律视为交易日」的夹具，直接测真实日历实现
    "real_trading_calendar: 用例自己控制 trading_days 表，不 patch 交易日判断",
]
